[package]
name = "zenoh_apps"
version = "0.1.0"
edition = "2021"

# Same Zenoh version as the zenohd/z_pub binaries built from the zenoh/ submodule
[dependencies]
zenoh = "=1.10.2"
tokio = { version = "1", features = ["full"] }
serde_json = "1"

# Binaries: src/bin/my_pub.rs, src/bin/my_sub.rs
# Build (static, runs in any container):
#   cross build --release --target x86_64-unknown-linux-musl
